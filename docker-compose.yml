name: lumen

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    # Host port 5433 (not 5432) to avoid colliding with a local Postgres install.
    # Intra-compose, services still reach it at postgres:5432.
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6380:6379"]  # host 6380 to avoid a local redis; intra-compose still redis:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # optional (s3 backend only):  docker compose --profile s3 up
    profiles: ["s3"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumen
      MINIO_ROOT_PASSWORD: lumen-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    # No healthcheck: the server image ships no curl/mc; `api` depends on it with
    # condition: service_started. A MinIO readiness gate is added with the bucket-init
    # job in M3 when object storage is first used.

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://lumen:lumen@postgres:5432/lumen
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lumen
      S3_ACCESS_KEY: lumen
      S3_SECRET_KEY: lumen-secret
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIM_SPEED: ${SIM_SPEED:-1}
      ALLOWED_ORIGINS: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8000
    ports: ["8000:8000"]
    # seed/ lives at the repo root; app/cli.py resolves it as /seed inside the container.
    volumes: ["./api:/app", "./seed:/seed:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./api
    command: arq app.workers.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://lumen:lumen@postgres:5432/lumen
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lumen
      S3_ACCESS_KEY: lumen
      S3_SECRET_KEY: lumen-secret
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIM_SPEED: ${SIM_SPEED:-1}
    volumes: ["./api:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    build: ./api
    command: python -m app.workers.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://lumen:lumen@postgres:5432/lumen
      REDIS_URL: redis://redis:6379/0
      SIM_SPEED: ${SIM_SPEED:-1}
    volumes: ["./api:/app"]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_PRODUCT_NAME: ${NEXT_PUBLIC_PRODUCT_NAME:-AdCraft AI}
    ports: ["3000:3000"]
    volumes: ["./web:/app", "/app/node_modules"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  miniodata:
